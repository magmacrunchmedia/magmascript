name: Release

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update (e.g. 1.6.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  update-tap:
    needs: publish
    if: always() && needs.publish.result == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: magmacrunchmedia/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Checkout magmascript repo
        uses: actions/checkout@v4
        with:
          path: magmascript

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Get version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate updated formula
        run: python magmascript/scripts/update-formula.py ${{ steps.version.outputs.version }} tap/Formula/magmascript.rb

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          branch: bump/magmascript-${{ steps.version.outputs.version }}
          title: "magmascript ${{ steps.version.outputs.version }}"
          body: "Auto-updated formula for magmascript ${{ steps.version.outputs.version }}"
          commit-message: "magmascript ${{ steps.version.outputs.version }}"
          add-paths: Formula/magmascript.rb
