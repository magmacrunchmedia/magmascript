name: Release

on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  update-tap:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download sdist and compute SHA
        id: sha
        run: |
          URL="https://files.pythonhosted.org/packages/source/m/magmascript/magmascript-${{ steps.version.outputs.version }}.tar.gz"
          curl -fsSL -o sdist.tar.gz "$URL"
          echo "sha256=$(shasum -a 256 sdist.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Update formula
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: magmacrunchmedia/homebrew-tap
          branch: bump/magmascript-${{ steps.version.outputs.version }}
          title: "magmascript ${{ steps.version.outputs.version }}"
          body: "Auto-updated formula for magmascript ${{ steps.version.outputs.version }}"
          commit-message: "magmascript ${{ steps.version.outputs.version }}"
          add-paths: Formula/magmascript.rb
