name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update (e.g. 1.6.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --generate-notes

  # Tell the website to re-embed the playground interpreter now rather than at
  # its weekly backstop sync. A separate job from update-tap so a tap failure
  # can't block the playground. Needs WEBSITE_DISPATCH_TOKEN: a fine-grained
  # PAT for magmacrunch-media/magmacrunch.com with Contents read/write.
  sync-playground:
    needs: publish
    if: always() && needs.publish.result == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for PyPI availability
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for magmascript $VERSION to be available on PyPI..."
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/magmascript/$VERSION/json")
            if [ "$STATUS" = "200" ]; then
              echo "Package available on PyPI (attempt $i)"
              exit 0
            fi
            echo "  Not yet (HTTP $STATUS), waiting 30s... (attempt $i/10)"
            sleep 30
          done
          echo "Package never appeared on PyPI; not dispatching a sync to a version pip cannot install"
          exit 1

      - name: Dispatch playground sync
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.WEBSITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/magmacrunch-media/magmacrunch.com/dispatches \
            -d '{"event_type":"magmascript-release","client_payload":{"version":"${{ steps.version.outputs.version }}"}}'

  update-tap:
    needs: publish
    if: always() && needs.publish.result == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: magmacrunch-media/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Checkout magmascript repo
        uses: actions/checkout@v4
        with:
          path: magmascript

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Get version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for PyPI availability
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for magmascript $VERSION to be available on PyPI..."
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/magmascript/$VERSION/json")
            if [ "$STATUS" = "200" ]; then
              echo "Package available on PyPI (attempt $i)"
              exit 0
            fi
            echo "  Not yet (HTTP $STATUS), waiting 30s... (attempt $i/10)"
            sleep 30
          done
          echo "Warning: Package may not be available yet, proceeding anyway"

      - name: Generate updated formula
        run: python magmascript/scripts/update-formula.py ${{ steps.version.outputs.version }} tap/Formula/magmascript.rb

      - name: Create PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
          branch: bump/magmascript-${{ steps.version.outputs.version }}
          title: "magmascript ${{ steps.version.outputs.version }}"
          body: "Auto-updated formula for magmascript ${{ steps.version.outputs.version }}"
          commit-message: "magmascript ${{ steps.version.outputs.version }}"
          add-paths: Formula/magmascript.rb
